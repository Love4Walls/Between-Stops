function normalizeChatMedia(m){
  const out=[];
  if(Array.isArray(m.media)) for(const item of m.media){
    if(typeof item==='string'){
      const k=item.indexOf('|');if(k>0)out.push({type:item.slice(0,k).trim().toLowerCase(),url:item.slice(k+1).trim()});
    }else if(item&&typeof item==='object'){
      const url=String(item.url||item.src||item.path||'').trim();
      const type=String(item.type||item.kind||'').trim().toLowerCase();
      if(url)out.push({type:type||(/\.(mp3|m4a|wav|ogg)(?:[?#]|$)/i.test(url)?'audio':'image'),url});
    }
  }
  if(typeof m.media==='string')for(const line of m.media.split('\n')){
    const k=line.indexOf('|');if(k>0)out.push({type:line.slice(0,k).trim().toLowerCase(),url:line.slice(k+1).trim()});
  }
  return out.filter(x=>['audio','image','video'].includes(x.type)&&x.url);
}
// Sort chronologically without changing the original story data. Keep equal-date messages stable.
function chatDateKey(value){
  const s=String(value||'').trim();
  const m=s.match(/(\d{4})\s*[年./-]\s*(\d{1,2})\s*[月./-]\s*(\d{1,2})\s*日?(?:\s+(\d{1,2})[:：](\d{1,2}))?/);
  if(!m)return null;
  const y=+m[1],mo=+m[2],d=+m[3],h=+(m[4]||0),mi=+(m[5]||0);
  if(mo<1||mo>12||d<1||d>31||h>23||mi>59)return null;
  const dt=new Date(y,mo-1,d,h,mi);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return dt.getTime();
}
function sortedChatMessages(messages){
  return messages.map((message,index)=>({message,index,key:chatDateKey(message.time)}))
    .sort((a,b)=>a.key===null&&b.key===null?a.index-b.index:a.key===null?1:b.key===null?-1:a.key-b.key||a.index-b.index)
    .map(item=>item.message);
}

function v10VoiceFormat(sec){if(!Number.isFinite(sec)||sec<0)return '0:00';const n=Math.floor(sec);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function v10VoiceUpdate(audio){const box=audio.closest('[data-voice-player]');if(!box)return;const duration=audio.duration;box.querySelector('.v10-voice-time').textContent=Number.isFinite(duration)&&duration>0?v10VoiceFormat(Math.max(0,duration-(audio.currentTime||0))):'0:00';box.querySelector('.v10-voice-seek').value=Number.isFinite(duration)&&duration>0?Math.round(audio.currentTime/duration*1000):0}
function v10VoiceEnded(audio){v10VoiceUpdate(audio);const b=audio.closest('[data-voice-player]').querySelector('.v10-voice-play');b.innerHTML='<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';b.setAttribute('aria-label','播放语音')}
function v10VoiceToggle(btn){const audio=btn.closest('[data-voice-player]').querySelector('audio');if(audio.paused){document.querySelectorAll('[data-voice-player] audio').forEach(a=>{if(a!==audio&&!a.paused){a.pause();v10VoiceEnded(a)}});audio.play().then(()=>{btn.innerHTML='<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>';btn.setAttribute('aria-label','暂停语音')}).catch(()=>{toast('语音无法播放，请检查音频路径和文件是否已上传。')})}else{audio.pause();v10VoiceEnded(audio)}}
function v10VoiceSeek(input){const audio=input.closest('[data-voice-player]').querySelector('audio');if(Number.isFinite(audio.duration)&&audio.duration>0){audio.currentTime=audio.duration*Number(input.value)/1000;v10VoiceUpdate(audio)}}

// V9: selected files stay in memory until exported as a media bundle.
const v9Files=new Map();
const v9ObjectURLs=new Map();
const v9SafeName=s=>String(s).normalize('NFKC').replace(/[^a-zA-Z0-9._-]/g,'_').replace(/^\.+/,'file').slice(0,100)||'file';
function v9StoreFile(file){
  let name=v9SafeName(file.name),path='media/'+name,idx=2;
  while(v9Files.has(path)){let dot=name.lastIndexOf('.');let base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';path='media/'+base+'-'+idx+++ext}
  v9Files.set(path,file);v9ObjectURLs.set(path,URL.createObjectURL(file));return path;
}
function v9Preview(){let e=document.getElementById('v9previews');if(!e)return;

}

// ZIP writer (store method) runs locally in browser, no external libraries.
const v9CRCtable=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function v9CRC(b){let c=0xffffffff;for(let v of b)c=v9CRCtable[(c^v)&255]^(c>>>8);return (c^0xffffffff)>>>0}
function v9Zip(entries){let encoder=new TextEncoder(),chunks=[],central=[],offset=0;const u16=(d,n,v)=>d.setUint16(n,v,true),u32=(d,n,v)=>d.setUint32(n,v>>>0,true);
 for(let [name,bytes] of entries){let nb=encoder.encode(name),crc=v9CRC(bytes),l=new Uint8Array(30+nb.length),d=new DataView(l.buffer);u32(d,0,0x04034b50);u16(d,4,20);u16(d,6,0x0800);u16(d,8,0);u32(d,14,crc);u32(d,18,bytes.length);u32(d,22,bytes.length);u16(d,26,nb.length);l.set(nb,30);chunks.push(l,bytes);
 let c=new Uint8Array(46+nb.length),cd=new DataView(c.buffer);u32(cd,0,0x02014b50);u16(cd,4,20);u16(cd,6,20);u16(cd,8,0x0800);u32(cd,16,crc);u32(cd,20,bytes.length);u32(cd,24,bytes.length);u16(cd,28,nb.length);u32(cd,42,offset);c.set(nb,46);central.push(c);offset+=l.length+bytes.length}
 let csize=central.reduce((s,b)=>s+b.length,0),end=new Uint8Array(22),ed=new DataView(end.buffer);u32(ed,0,0x06054b50);u16(ed,8,entries.length);u16(ed,10,entries.length);u32(ed,12,csize);u32(ed,16,offset);return new Blob([...chunks,...central,end],{type:'application/zip'});
}
async function v9ExportBundle(){try{
 let entries=[['story.json',new TextEncoder().encode(JSON.stringify(data,null,2))]];
 for(let [path,file] of v9Files)entries.push([path,new Uint8Array(await file.arrayBuffer())]);
 entries.push(['README.txt',new TextEncoder().encode('X ROOM V9 MEDIA PACKAGE\nUpload story.json and the media folder contents to the ROOT of your GitHub repository. IMPORTANT: ZIP contains ONLY media selected in this editing session. Keep previously uploaded media files on GitHub. Do NOT upload only the HTML or only story.json. For browser playback, MP4 should use H.264 video and AAC audio. GitHub paths and filename capitalization must match story.json exactly.\n')]);

 }catch(e){toast('打包失败：'+e.message)}
}

function v20FlightMap(t,sfx){

 const mx=(x1+x2)/2,my=(y1+y2)/2,d=Math.hypot(x2-x1,y2-y1);

 return `<svg class="v20-mapsvg" viewBox="${vx.toFixed(2)} ${vy.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}" preserveAspectRatio="xMidYMid slice" font-family="-apple-system,PingFang SC,Helvetica,sans-serif" role="img" aria-label="航线地图">

  ${endLabel(x2,y2,t.to||'到达',t.tc||'',dAnchor,-k*2.4)}
  <g class="v20-plane"><g transform="scale(${(k*1.5).toFixed(2)}) rotate(90)"><path d="M0-1.2.4-.3 2.2.6V1L.4.6.3 1.6 1 2v.3L0 2.1-1 2.3V2l.7-.4-.1-1L-2.2 1V.6l1.8-.9Z" fill="#fff" stroke="#ff9f0a" stroke-width=".4"/></g><animateMotion dur="4s" begin="1s" repeatCount="indefinite" rotate="auto"><mpath href="#${rid}"/></animateMotion></g>
  <g transform="translate(${(vx+w*.93).toFixed(2)},${(vy+h*.14).toFixed(2)})"><circle r="${k*3}" fill="#fff" opacity=".92"/><path d="M0-${k*1.7}L${k*.75} ${k*1}L0 ${k*.45}L-${k*.75} ${k*1}Z" fill="#ff9f0a"/></g>
  <text x="${(vx+w*.025).toFixed(2)}" y="${(vy+h*.96).toFixed(2)}" font-size="${k*2.1}" fill="#4d7a9e" opacity=".65">Legal</text>
 </svg>`;

function v19BindFilm(){
 const cam=document.getElementById('polCam'),st=document.getElementById('polStage');if(!cam||!st)return;
 let ry=-19,rx=-7,dr=0,x0,y0,a0,b0;
 const set=()=>{cam.style.setProperty('--pry',ry+'deg');cam.style.setProperty('--prx',rx+'deg')};
 st.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dr=1;x0=e.clientX;y0=e.clientY;a0=ry;b0=rx;try{st.setPointerCapture(e.pointerId)}catch(_){}});
 st.addEventListener('pointermove',e=>{if(!dr)return;const dx=e.clientX-x0,dy=e.clientY-y0;ry=Math.max(-42,Math.min(42,a0+dx*.22));rx=Math.max(-22,Math.min(14,b0+dy*.16));set()});
 const up=()=>{dr=0};
 st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
 set();
}
function polSnap(ev){
 if(ev){ev.preventDefault();ev.stopPropagation()}
 if(polBusy)return;
 if(polShots.length>=5){toast('这一卷已经拍满 5 张 · 可以点「重新装卷」');return}
 const roll=v19Roll();
 polBusy=true;
 const slot=polShots.length;polShots.push(slot);
 const fl=document.getElementById('polFlash');if(fl){fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on')}
 const sh=document.getElementById('polShake');if(sh){sh.classList.remove('shake');void sh.offsetWidth;sh.classList.add('shake')}
 polSound();
 setTimeout(()=>{
  const tray=document.getElementById('polTray');if(tray)tray.innerHTML=v19PhotoHTML(roll[slot],slot+1,'eject');
  const rail=document.getElementById('polRail');if(rail)rail.innerHTML=v19RailHTML();
  const cnt=document.getElementById('polCount');if(cnt)cnt.textContent=`FRAME ${String(polShots.length).padStart(2,'0')} / 05`;
  const meta=document.querySelector('.v19-pol-meta span');if(meta)meta.textContent=`${polShots.length} / 5 张 · 宽幅即时成像`;
  const shb=document.querySelector('.v19-shutter');if(shb&&polShots.length>=5)shb.classList.add('full');
  const trayEl=document.getElementById('polTray');if(trayEl)trayEl.scrollIntoView({behavior:'smooth',block:'nearest'});
  setTimeout(()=>{const ins=document.querySelector('#polTray .v19-instant');if(ins)ins.classList.add('developed')},620);
  setTimeout(()=>{polBusy=false},1050);
 },430);
}
function polReset(){polShots=[];polBusy=false;render();toast('已换上一卷新的相纸')}
function polSound(){
 try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=polSound._ac||(polSound._ac=new AC());if(ac.state==='suspended')ac.resume();const t=ac.currentTime;
  const len=Math.floor(ac.sampleRate*.06),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);
  const s=ac.createBufferSource();s.buffer=buf;const g=ac.createGain();g.gain.value=.16;s.connect(g).connect(ac.destination);s.start(t);
  const o=ac.createOscillator(),og=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(140,t+.05);o.frequency.exponentialRampToValueAtTime(55,t+.5);og.gain.setValueAtTime(.001,t+.04);og.gain.linearRampToValueAtTime(.035,t+.16);og.gain.exponentialRampToValueAtTime(.001,t+.55);o.connect(og).connect(ac.destination);o.start(t+.04);o.stop(t+.58);
 }catch(e){}
}
function sealSound(){
 try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=sealSound._ac||(sealSound._ac=new AC());if(ac.state==='suspended')ac.resume();const t=ac.currentTime,len=Math.floor(ac.sampleRate*.45),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++){const env=Math.pow(1-i/len,1.2);d[i]=(Math.random()*2-1)*env*(.5+.5*Math.sin(i*.02))}const s=ac.createBufferSource();s.buffer=buf;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1900;f.Q.value=.7;const g=ac.createGain();g.gain.value=.11;s.connect(f).connect(g).connect(ac.destination);s.start(t)}catch(e){}
}

let lb={z:1,x:0,y:0,pts:new Map(),moved:0,d0:0,z0:1,sx:0,sy:0,x0:0,y0:0};
function polOpenShot(k){
 const slot=polShots[k];if(slot==null)return;
 const p=v19Roll()[slot];if(!p)return;
 const src=v19PicSrc(p),cap=v19PicCap(p),date=v19PicDate(p),grad=p.pending?'fbp':v19Grad(p);
 const lbEl=document.createElement('div');lbEl.className='v19-lb';lbEl.id='polLb';lbEl.innerHTML=`<button class="v19-lb-x" onclick="polClose()" aria-label="关闭">×</button><div class="v19-lb-card"><div class="v19-lb-win" id="polWin"><div class="v19-lb-zoom" id="polZoom">${src?`<img loading="lazy" decoding="async" src="${src}" alt="">`:''}</div></div></div><p class="v19-lb-hint">滚轮缩放 · 拖动查看 · 双击复位 · Esc 关闭</p>`;
 document.body.appendChild(lbEl);document.documentElement.classList.add('v19-noscroll');
 lb={z:1,x:0,y:0,pts:new Map(),moved:0,d0:0,z0:1,sx:0,sy:0,x0:0,y0:0};lbApply();
 const win=document.getElementById('polWin');
 const dist=()=>{const a=[...lb.pts.values()];if(a.length<2)return 0;return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 win.addEventListener('pointerdown',e=>{try{win.setPointerCapture(e.pointerId)}catch(_){}lb.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(lb.pts.size===2){lb.d0=dist();lb.z0=lb.z}if(lb.pts.size===1){lb.moved=0;lb.sx=e.clientX;lb.sy=e.clientY;lb.x0=lb.x;lb.y0=lb.y}});
 win.addEventListener('pointermove',e=>{if(!lb.pts.has(e.pointerId))return;lb.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(lb.pts.size>=2){const d=dist();if(lb.d0>0){lb.z=clamp(lb.z0*d/lb.d0,1,5);lbApply()}return}
  const dx=e.clientX-lb.sx,dy=e.clientY-lb.sy;if(Math.abs(dx)+Math.abs(dy)>6)lb.moved=1;
  if(lb.z>1){lb.x=lb.x0+dx;lb.y=lb.y0+dy;lbApply()}
 });
 const end=e=>{lb.pts.delete(e.pointerId);if(lb.pts.size===0&&!lb.moved){lb.z=lb.z>1?1:2.2;lb.x=0;lb.y=0;lbApply()}};
 win.addEventListener('pointerup',end);win.addEventListener('pointercancel',end);
 win.addEventListener('dblclick',e=>{e.preventDefault();lbReset()});
 win.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.14:1/1.14;lb.z=clamp(lb.z*f,1,5);if(lb.z===1){lb.x=0;lb.y=0}lbApply()},{passive:false});
 lbEl.addEventListener('click',e=>{if(e.target===lbEl)polClose()});
}
function lbClamp(){const win=document.getElementById('polWin');if(!win||!lb.z)return;const r=win.getBoundingClientRect(),mx=(r.width*(lb.z-1))/2,my=(r.height*(lb.z-1))/2;lb.x=Math.max(-mx,Math.min(mx,lb.x));lb.y=Math.max(-my,Math.min(my,lb.y))}
function lbApply(){lbClamp();const el=document.getElementById('polZoom');if(el)el.style.transform=`translate(${lb.x}px,${lb.y}px) scale(${lb.z})`}
function lbZoom(d){lb.z=Math.max(1,Math.min(5,lb.z+d*.5));if(lb.z===1){lb.x=0;lb.y=0}lbApply()}
function lbReset(){lb.z=1;lb.x=0;lb.y=0;lbApply()}
function polClose(){const el=document.getElementById('polLb');if(el)el.remove();document.documentElement.classList.remove('v19-noscroll');lb.pts=new Map()}
